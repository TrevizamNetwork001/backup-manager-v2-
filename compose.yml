services:
  nginx:
    image: nginx:1.28-alpine
    container_name: backup-manager-v2-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backup-manager-v2
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: backup-manager-v2-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      SESSION_SECURE_COOKIE: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      TRUSTED_PROXIES: ${BACKUP_TRUSTED_PROXIES:-172.18.0.0/16}
      BACKUP_STORAGE_ROOT: /data/backups
      BACKUP_FTP_ROOT: /data/ftp
      BACKUP_FTP_HOST: ${BACKUP_FTP_HOST:-}
      BACKUP_FTP_PASSIVE_ADDRESS: ${BACKUP_FTP_PASSIVE_ADDRESS:-}
      BACKUP_FTP_PUBLIC_IP: ${BACKUP_FTP_PUBLIC_IP:-}
      BACKUP_FTP_MAX_BYTES: ${BACKUP_FTP_MAX_BYTES:-8388608}
      BACKUP_A10_ENABLED: ${BACKUP_A10_ENABLED:-false}
      BACKUP_ENGINE_STALE_SECONDS: ${BACKUP_ENGINE_STALE_SECONDS:-300}
      BACKUP_RETENTION_ENABLED: ${BACKUP_RETENTION_ENABLED:-false}
      BACKUP_RETENTION_TIME: ${BACKUP_RETENTION_TIME:-04:30}
    volumes:
      - ./app:/var/www/html:ro
      - ./engine:/engine:ro
      - ./app/storage:/var/www/html/storage
      - ./app/bootstrap/cache:/var/www/html/bootstrap/cache
      - ./docker/php/storage-pool.conf:/usr/local/etc/php-fpm.d/zz-storage.conf:ro
      - backups:/data/backups
      - ftp-data:/data/ftp:ro
      - engine-health:/var/www/html/storage/app/engine-health
    networks:
      - backup-manager-v2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine-health-init:
        condition: service_completed_successfully

  backup-storage-init:
    image: busybox:1.37.0
    network_mode: none
    command: ["sh", "-c", "chown 65534:65534 /data/backups && chmod 700 /data/backups"]
    volumes:
      - backups:/data/backups
    restart: "no"

  # ENGINE-3: the engine (user: nobody) and the app (php-fpm, www-data) are
  # different UIDs with no shared group, so the tiny health-snapshot file
  # they exchange (see docs/ENGINE_HEALTH.md) needs a spot both can touch.
  # It carries no secrets (versions, driver names, capability lists only),
  # so world-writable on this one small, dedicated volume is an accepted
  # trade-off — never reuse this volume for anything else.
  engine-health-init:
    image: busybox:1.37.0
    network_mode: none
    command: ["sh", "-c", "chmod 777 /health"]
    volumes:
      - engine-health:/health
    restart: "no"

  engine:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: backup-manager-v2-engine
    restart: unless-stopped
    user: nobody
    group_add:
      - "${BACKUP_A10_SFTP_GID:-25001}"
    working_dir: /var/www/html
    command: ["/opt/engine-venv/bin/python", "/engine/backup_engine.py"]
    environment:
      BACKUP_STORAGE_ROOT: /data/backups
      BACKUP_FTP_HOST: ${BACKUP_FTP_HOST:-}
      BACKUP_FTP_MAX_BYTES: ${BACKUP_FTP_MAX_BYTES:-8388608}
      BACKUP_FTP_ROOT: /data/ftp
      BACKUP_A10_SCP_ROOT: /data/a10-scp
      BACKUP_A10_SFTP_ROOT: /data/a10-sftp
      BACKUP_A10_ENABLED: ${BACKUP_A10_ENABLED:-false}
      BACKUP_A10_TRANSPORT: ${BACKUP_A10_TRANSPORT:-scp}
      BACKUP_A10_TRANSFER_HOST: ${BACKUP_A10_TRANSFER_HOST:-}
      BACKUP_A10_SFTP_USER: ${BACKUP_A10_SFTP_USER:-a10backup}
      BACKUP_A10_SCP_HOST: ${BACKUP_A10_SCP_HOST:-}
      BACKUP_FTP_STABLE_SECONDS: ${BACKUP_FTP_STABLE_SECONDS:-5}
      BACKUP_FTP_RECEIVE_TIMEOUT_SECONDS: ${BACKUP_FTP_RECEIVE_TIMEOUT_SECONDS:-180}
      BACKUP_ENGINE_HEARTBEAT_SECONDS: ${BACKUP_ENGINE_HEARTBEAT_SECONDS:-30}
      BACKUP_ENGINE_HEALTH_SNAPSHOT_PATH: /var/www/html/storage/app/engine-health/snapshot.json
    volumes:
      - ./app:/var/www/html:ro
      - ./engine:/engine:ro
      - backups:/data/backups
      - ftp-data:/data/ftp
      - a10-scp-data:/data/a10-scp:ro
      - ./storage/a10-sftp:/data/a10-sftp
      - ./app/storage:/var/www/html/storage
      - engine-health:/var/www/html/storage/app/engine-health
    networks:
      - backup-manager-v2
    depends_on:
      postgres:
        condition: service_healthy
      backup-storage-init:
        condition: service_completed_successfully
      engine-health-init:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: backup-manager-v2-scheduler
    restart: unless-stopped
    user: nobody
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    environment:
      BACKUP_STORAGE_ROOT: /data/backups
      BACKUP_ENGINE_STALE_SECONDS: ${BACKUP_ENGINE_STALE_SECONDS:-300}
      BACKUP_SCHEDULER_GRACE_MINUTES: ${BACKUP_SCHEDULER_GRACE_MINUTES:-5}
      BACKUP_RETENTION_ENABLED: ${BACKUP_RETENTION_ENABLED:-false}
      BACKUP_RETENTION_TIME: ${BACKUP_RETENTION_TIME:-04:30}
      BACKUP_A10_ENABLED: ${BACKUP_A10_ENABLED:-false}
      BACKUP_FTP_PROBE_HOST: ftp
    volumes:
      - ./app:/var/www/html:ro
      - ./app/storage:/var/www/html/storage
      - ./app/bootstrap/cache:/var/www/html/bootstrap/cache
      - backups:/data/backups
      - ftp-log:/var/log/backup-ftp:ro
    networks:
      - backup-manager-v2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ftp:
    build:
      context: .
      dockerfile: docker/ftp/Dockerfile
    container_name: backup-manager-v2-ftp
    restart: unless-stopped
    command: ["python3", "/ftp/server.py"]
    cap_add:
      - DAC_READ_SEARCH
      - SYS_NICE
    environment:
      BACKUP_FTP_PASSIVE_ADDRESS: ${BACKUP_FTP_PASSIVE_ADDRESS:-}
      BACKUP_FTP_PUBLIC_IP: ${BACKUP_FTP_PUBLIC_IP:-} # Deprecated launcher fallback.
      BACKUP_FTP_MAX_BYTES: ${BACKUP_FTP_MAX_BYTES:-8388608}
    ports:
      - "0.0.0.0:21:21/tcp"
      - "0.0.0.0:30000-30009:30000-30009/tcp"
    volumes:
      - ftp-data:/data/ftp
      - ftp-db:/etc/backup-ftp:ro
      - ftp-log:/var/log/backup-ftp
    networks:
      - backup-manager-v2
    depends_on:
      - ftp-admin

  ftp-admin:
    build:
      context: .
      dockerfile: docker/ftp/Dockerfile
    container_name: backup-manager-v2-ftp-admin
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["python3", "/ftp/admin.py"]
    environment:
      LOG_CHANNEL: stderr
      BACKUP_STORAGE_ROOT: /data/backups
      BACKUP_FTP_ROOT: /data/ftp
    volumes:
      - ./app:/var/www/html:ro
      - ftp-data:/data/ftp
      - backups:/data/backups
      - ftp-db:/etc/backup-ftp
    networks:
      - backup-manager-v2
    depends_on:
      postgres:
        condition: service_healthy

  a10-scp-init:
    image: busybox:1.37.0
    profiles: [a10]
    network_mode: none
    command: ["sh", "-c", "chown 65534:65534 /data/a10-scp && chmod 700 /data/a10-scp"]
    volumes:
      - a10-scp-data:/data/a10-scp
    restart: "no"

  a10-scp:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    profiles: [a10]
    restart: unless-stopped
    user: nobody
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    working_dir: /var/www/html
    command: ["/opt/engine-venv/bin/python", "/engine/a10_scp_server.py"]
    environment:
      BACKUP_A10_SCP_ROOT: /data/a10-scp
      BACKUP_A10_ENABLED: ${BACKUP_A10_ENABLED:-false}
      LOG_CHANNEL: stderr
      CACHE_STORE: array
    ports:
      - "${BACKUP_A10_SCP_BIND:-127.0.0.1}:${BACKUP_A10_SCP_PORT:-2222}:2222/tcp"
    volumes:
      - ./app:/var/www/html:ro
      - ./engine:/engine:ro
      - a10-scp-data:/data/a10-scp
    networks:
      - backup-manager-v2
    depends_on:
      postgres:
        condition: service_healthy
      a10-scp-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17
    container_name: backup-manager-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
    networks:
      - backup-manager-v2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: backup-manager-v2-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - ./storage/redis:/data
    networks:
      - backup-manager-v2
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backup-manager-v2:
    name: backup-manager-v2

volumes:
  backups:
  ftp-data:
  ftp-db:
  ftp-log:
  engine-health:
  a10-scp-data:
