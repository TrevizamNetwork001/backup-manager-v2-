; RELEASE-1.1: use the existing private artifact owner; do not broaden modes.
; www-data group retains access to Laravel storage and bootstrap/cache.
[global]
error_log = /var/www/html/storage/logs/php-fpm-error.log

[www]
user = nobody
group = www-data
access.log = /var/www/html/storage/logs/php-fpm-access.log
access.format = "%t %m %r %s %{milliseconds}d %{megabytes}M"
php_admin_flag[log_errors] = on
php_admin_value[session.upload_progress.enabled] = 0
