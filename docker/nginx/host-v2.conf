# Host reverse proxy. Remove the matching port-80 block from the V1 site
# before installing this file; leave its port-443 server unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name backup.trevizamnetwork.com.br;

    return 301 https://backup.trevizamnetwork.com.br:8443$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name backup.trevizamnetwork.com.br;

    client_max_body_size 10m;
    ssl_certificate /etc/letsencrypt/live/backup.trevizamnetwork.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backup.trevizamnetwork.com.br/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:backup_manager_v2_ssl:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # HSTS is deliberately withheld until the shared domain's HTTPS is definitive.

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host backup.trevizamnetwork.com.br:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
