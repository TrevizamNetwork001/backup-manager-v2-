map $http_host $backup_manager_public_port {
    "~:([0-9]{1,5})$" $1;
    default "";
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 32M;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # The outer proxy serves v2 on :8443. Preserve the public port so
        # Laravel generates form actions and redirects to v2, not v1 on :443.
        fastcgi_param HTTP_X_FORWARDED_PORT $backup_manager_public_port if_not_empty;
        fastcgi_pass app:9000;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
